<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f07a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ミニバス練習ノート</title>
<link rel="stylesheet" href="static/app.css">
<link rel="stylesheet" href="static/legacy.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><span>🏀</span><div><small>SMALL STEPS, BIG DREAMS</small>ミニバス<br>練習ノート</div></div>
    <nav id="nav" class="navlist">
      <button class="nav" data-tab="home"><i>🏠</i><span>ホーム</span></button>
      <button class="nav" data-tab="practice"><i>📺</i><span>練習</span></button>
      <button class="nav" data-tab="buddy"><i>🐰</i><span>相棒</span></button>
      <button class="nav" data-tab="gacha"><i>🎁</i><span>ガチャ</span></button>
      <button class="nav" data-tab="play"><i>🎮</i><span>ゲーム</span></button>
      <button class="nav" data-tab="record"><i>📅</i><span>記録</span></button>
      <button class="nav" data-tab="manager"><i>🐻</i><span>監督</span></button>
    </nav>
    <div class="spacer"></div>
    <button class="nav sub" id="openingBtn"><i>🎬</i><span>オープニング</span></button>
    <button class="nav sub" data-tab="settings"><i>⚙️</i><span>設定</span></button>
  </aside>
  <main class="main">
    <div id="hud"></div>
    <div id="content">読み込み中…</div>
    <footer class="muted">ミニバス練習ノート v3 ／ キャラクター・カットイン・アイテム画像はMicrosoft Copilotで生成。技・能力はゲーム内の表現で、実際の技術の習得判定ではありません。</footer>
  </main>
</div>
<div id="notice" role="status" class="notice hidden"></div>
<div id="reward" class="reward" aria-hidden="true"><img id="rewardImg" alt=""><b id="rewardAmt"></b><p id="rewardMsg"></p></div>
<div id="undo" class="undo" role="status"><span id="undoMsg"></span><button id="undoBtn">間違えた（取り消す）</button></div>
<dialog id="dialog"><div id="modal"></div></dialog>
<div id="cutin" class="cutin hidden" role="dialog" aria-modal="true" aria-label="技のカットイン" tabindex="0"><div class="cutinpanel"><img id="cutinImage" alt="技の発動"><div class="cutintext"><p id="cutinName"></p><h2 id="cutinSkill"></h2><small>タップでスキップ</small></div></div></div>
<div id="fx" class="fx hidden" role="dialog" aria-modal="true" aria-label="演出" tabindex="0"></div>
<script src="static/legacy.js"></script>
<script src="static/app.js"></script>
<script src="static/gamefx.js"></script>
<script src="static/dribble.js"></script>
<script src="static/shoot.js"></script>
<script src="core.js"></script>
<script src="pwa.js"></script>
</body>
</html>
